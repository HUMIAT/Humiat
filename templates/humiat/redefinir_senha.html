<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Humiat ID | Nova senha</title><link rel="icon" href="/static/icons/humiat/favicon.ico"><link rel="stylesheet" href="/static/css/humiat-design-system.css?v={{ HUMIAT_ID_VERSION }}"><link rel="stylesheet" href="/static/css/humiat-adminator.css?v={{ HUMIAT_ID_VERSION }}"></head>
<body class="humiat-adminator h-auth-page"><main class="h-auth-shell"><a class="h-auth-brand" href="/"><img src="/static/img/logo-humiat.svg" alt="Humiat"><span>Humiat ID <small>v{{ HUMIAT_ID_VERSION }}</small></span></a><section class="h-auth-card"><div class="h-auth-intro"><p class="h-auth-kicker">Humiat ID</p><h1>Crie sua<br>nova senha.</h1><p>O link de recuperação é temporário e só pode ser utilizado uma vez.</p></div><form method="post" action="/redefinir-senha" class="h-auth-form"><h2>Nova senha</h2>{% if erro %}<div class="id-alert">{{ erro }}</div>{% endif %}{% if valido %}<input type="hidden" name="token" value="{{ token }}"><label>Nova senha<input type="password" name="senha" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label><label>Confirmar senha<input type="password" name="confirmar" autocomplete="new-password" minlength="8" required placeholder="Repita a nova senha"></label><button class="btn-primary" type="submit">Salvar nova senha</button>{% else %}<div class="id-alert">Este link expirou ou já foi utilizado.</div><a class="h-auth-link" href="/esqueci-senha">Solicitar outro link</a>{% endif %}</form></section></main></body></html>
