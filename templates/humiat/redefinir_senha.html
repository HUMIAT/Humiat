<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Humiat ID | Nova senha</title><link rel="icon" href="/static/icons/humiat/favicon.ico"><link rel="stylesheet" href="/static/css/humiat-id.css"></head><body class="id-body">
<main class="login-shell"><a class="id-brand" href="/"><img src="/static/img/logo-humiat.svg" alt="Humiat"><span>Humiat ID</span></a><section class="login-panel"><div><p class="eyebrow">Humiat ID</p><h1>Crie sua<br>nova senha.</h1><p>O link de recuperação é temporário e só pode ser utilizado uma vez.</p></div><form method="post" action="/redefinir-senha" class="login-form"><h2>Nova senha</h2>{% if erro %}<div class="id-alert">{{ erro }}</div>{% endif %}{% if valido %}<input type="hidden" name="token" value="{{ token }}"><label>Nova senha<input type="password" name="senha" autocomplete="new-password" minlength="8" required placeholder="Mínimo de 8 caracteres"></label><label>Confirmar senha<input type="password" name="confirmar" autocomplete="new-password" minlength="8" required placeholder="Repita a nova senha"></label><button type="submit">Salvar nova senha</button>{% else %}<div class="id-alert">Este link expirou ou já foi utilizado.</div><a class="id-forgot" href="/esqueci-senha">Solicitar outro link</a>{% endif %}</form></section></main></body></html>
