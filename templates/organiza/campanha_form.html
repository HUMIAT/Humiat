{% extends "organiza/base.html" %}
{% block conteudo %}
<section class="pagina-clean campanhas-pagina campanha-form-pagina">
  <div class="titulo-linha campanhas-topo">
    <div>
      <p class="tag">Nova campanha</p>
      <h1>Criar campanha</h1>
      <p class="texto-suave">{{ total_elegiveis }} clientes ativos na Lista de Atualização.</p>
    </div>
    <a class="botao fantasma" href="/organiza/campanhas">Cancelar</a>
  </div>

  {% if erro %}<div class="alerta erro">{{ erro }}</div>{% endif %}

  <form method="post" enctype="multipart/form-data" class="cartao campanha-form">
    <label class="campo-form">
      <span>Nome da campanha</span>
      <input name="nome" value="{{ form_nome or '' }}" placeholder="Ex.: Natal e Ano Novo" required autofocus>
    </label>

    <label class="campo-form">
      <span>Lista</span>
      <select name="lista_tipo">
        <option value="ATUALIZACAO">Clientes de Atualização ({{ total_elegiveis }})</option>
      </select>
      <small>Equipamento ativo + atualização disponível para {{ pacote_atual }}.</small>
    </label>

    <label class="campo-form">
      <span>Mensagem</span>
      <textarea name="mensagem" rows="7" placeholder="Digite a mensagem que será aberta no WhatsApp..." required>{{ form_mensagem or '' }}</textarea>
      <small>Opcional: use <b>{nome}</b> para inserir o nome do cliente.</small>
    </label>

    <label class="campo-form">
      <span>Foto (opcional)</span>
      <input type="file" name="imagem" accept="image/*">
      <small>Até 5 MB. Quando houver foto, o link dela será incluído na mensagem para gerar a visualização no WhatsApp.</small>
    </label>

    <div class="campanha-form-acoes campanha-acao-principal-mobile">
      <button class="botao primario campanha-botao-grande" type="submit">Salvar campanha</button>
    </div>
  </form>
</section>
{% endblock %}
